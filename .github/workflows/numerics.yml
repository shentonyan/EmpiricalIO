name: Numerical checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-checks:
    runs-on: ubuntu-latest
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install package dependencies
        shell: Rscript --vanilla {0}
        run: |
          options(repos = c(CRAN = Sys.getenv("RSPM", "https://cloud.r-project.org")))
          install.packages(c("Rcpp", "RcppEigen", "dplyr", "foreach", "magrittr",
                             "nleqslv", "purrr", "reshape2", "rmarkdown", "tidyr"))
      - name: Compile and install the package
        run: R CMD INSTALL --preclean .
      - name: Check installed auction functions
        working-directory: tests
        run: Rscript --vanilla auction.R
      - name: Check installed dynamic decision functions
        working-directory: tests
        run: Rscript --vanilla dynamics.R
